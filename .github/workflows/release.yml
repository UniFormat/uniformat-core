name: release
# Builds and attaches the artifacts for a tag. It does NOT publish to crates.io or PyPI: publishing is manual.
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
