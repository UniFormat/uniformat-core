name: ci
on: [push, pull_request]
jobs:
  rust:
    uses: UniFormat/.github/.github/workflows/rust-ci.yml@main
    with:
      repo: uniformat-core
    secrets: inherit
  python:
    uses: UniFormat/.github/.github/workflows/python-ci.yml@main
    with:
      repo: uniformat-core
      project-dir: python
    secrets: inherit
